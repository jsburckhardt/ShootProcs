name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          fi
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.number }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Verify and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$TAG" ShootProcs-Setup.exe ShootProcs-win-x64.zip SHA256SUMS.txt \
            --verify-tag --title "ShootProcs $TAG" --generate-notes \
            --notes "Windows 11 x64. Download ShootProcs-Setup.exe for a per-user installation (no admin needed), or extract the portable ZIP. Runtime included. Builds are unsigned. Enable tracing explicitly to request admin access for disk/network metrics."

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: "1.0.0"

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, tests and installer
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ContinuousIntegrationBuild: "true"
      RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages*.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore ShootProcs.sln --locked-mode
      - name: Build, verify native behavior, and package
        shell: pwsh
        run: .\build.ps1 -Verify -Installer -Version $env:RELEASE_VERSION
      - name: Install, launch, and uninstall
        shell: pwsh
        run: .\tools\Test-Installer.ps1
      - name: Upload release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            artifacts/ShootProcs-Setup.exe
            artifacts/ShootProcs-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
